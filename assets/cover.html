<!doctype html>
<!-- Обложка 640×360 для /newapp в BotFather. Рендер: см. GITHUB.md / assets/render-cover.sh -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 640px; height: 360px; overflow: hidden; }
  body {
    font-family: Montserrat, sans-serif;
    color: #f4f6f8;
    background:
      radial-gradient(420px 300px at 470px 190px, rgba(39,242,39,.16), transparent 70%),
      radial-gradient(300px 220px at 60px 360px, rgba(39,242,39,.08), transparent 70%),
      #0e1217;
    position: relative;
  }
  .e { font-family: "Noto Color Emoji", "Segoe UI Emoji", sans-serif; }

  .left { position: absolute; left: 38px; top: 40px; width: 300px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #1f262e; border: 1px solid #2d353f; border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 700; color: #b9c2cc;
  }
  h1 { font-weight: 900; font-size: 62px; line-height: .98; letter-spacing: -.02em; margin: 18px 0 14px; }
  h1 span { color: #27f227; }
  p { font-size: 15px; line-height: 1.4; color: #9aa4b0; font-weight: 500; }
  .btn {
    margin-top: 22px; display: inline-block;
    background: #27f227; color: #062b06; font-weight: 800; font-size: 18px;
    padding: 13px 34px; border-radius: 18px;
    box-shadow: 0 8px 26px rgba(39,242,39,.4);
  }

  .machine {
    position: absolute; right: 30px; top: 30px;
    width: 262px; height: 300px;
    background: #141a20; border-radius: 26px; padding: 14px 10px;
    display: flex; gap: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1px #232a32;
    transform: rotate(3deg);
  }
  .col {
    flex: 1; background: #1a2027; border-radius: 18px; padding: 6px 5px;
    display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
  }
  .cell {
    height: 84px; background: #222931; border-radius: 13px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .cell .e { font-size: 36px; line-height: 1; }
  .cell b { font-size: 9.5px; font-weight: 600; color: #e6eaee; letter-spacing: -.01em; }
  .cell.dim { opacity: .45; }
  .cell.win { outline: 3px solid #27f227; outline-offset: -3px; box-shadow: 0 0 16px rgba(39,242,39,.45), inset 0 0 10px rgba(39,242,39,.3); }
  .col::before, .col::after { content: ""; position: absolute; left: 0; right: 0; height: 30px; z-index: 2; }
  .col::before { top: 0; background: linear-gradient(#1a2027, transparent); }
  .col::after { bottom: 0; background: linear-gradient(transparent, #1a2027); }

  .conf { position: absolute; width: 9px; height: 14px; border-radius: 2px; }
</style>
</head>
<body>
  <div class="left">
    <div class="chip"><span class="e">🎰</span> Telegram Mini App</div>
    <h1>Рулетка<br><span>еды</span></h1>
    <p>Не знаешь, что приготовить?<br>Крути — и ужин решён!</p>
    <div class="btn">Крутить!</div>
  </div>

  <div class="machine">
    <div class="col">
      <div class="cell dim"><span class="e">🍚</span><b>Рис</b></div>
      <div class="cell win"><span class="e">🥔</span><b>Картофель</b></div>
      <div class="cell dim"><span class="e">🥦</span><b>Овощи</b></div>
    </div>
    <div class="col">
      <div class="cell dim"><span class="e">🥩</span><b>Стейк</b></div>
      <div class="cell win"><span class="e">🍗</span><b>Ножки</b></div>
      <div class="cell dim"><span class="e">🐟</span><b>Рыба</b></div>
    </div>
    <div class="col">
      <div class="cell dim"><span class="e">🫕</span><b>Запекать</b></div>
      <div class="cell win"><span class="e">🍳</span><b>Жарить</b></div>
      <div class="cell dim"><span class="e">🍲</span><b>Варить</b></div>
    </div>
  </div>

  <i class="conf" style="left:338px;top:34px;background:#ffb020;transform:rotate(25deg)"></i>
  <i class="conf" style="left:352px;top:300px;background:#4fc3ff;transform:rotate(-30deg)"></i>
  <i class="conf" style="left:604px;top:14px;background:#ff5a5f;transform:rotate(60deg)"></i>
  <i class="conf" style="left:610px;top:330px;background:#27f227;transform:rotate(15deg)"></i>
  <i class="conf" style="left:300px;top:150px;background:#b46bff;transform:rotate(-50deg);width:7px;height:11px"></i>
  <i class="conf" style="left:250px;top:24px;background:#27f227;transform:rotate(40deg);width:7px;height:11px"></i>
</body>
</html>
